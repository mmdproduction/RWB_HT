stages: [test, integration]
unit-and-api:
  image: python:3.12-slim
  stage: test
  services:
    - name: postgres:17.9
      alias: postgres
  variables:
    POSTGRES_DB: pipeline_test
    POSTGRES_USER: pipeline_test
    POSTGRES_PASSWORD: test_password
    TEST_DATABASE_URL: postgresql://pipeline_test:test_password@postgres:5432/pipeline_test
  script:
    - pip install -r requirements-dev.txt
    - python -m pytest tests/test_models.py tests/test_api.py tests/test_worker.py -q --junitxml=unit-results.xml
  artifacts:
    when: always
    reports:
      junit: unit-results.xml
target-projects:
  image: docker:27-cli
  stage: integration
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    RUN_TEMPLATE_INTEGRATION: "1"
  script:
    - apk add --no-cache python3 py3-pip
    - python3 -m venv .venv
    - .venv/bin/pip install -r requirements-dev.txt
    - .venv/bin/python -m pytest tests/test_templates.py -q --junitxml=target-results.xml
  artifacts:
    when: always
    reports:
      junit: target-results.xml
