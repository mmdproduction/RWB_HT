{
  "services": {
    "db": {
      "build": "./db",
      "environment": {
        "POSTGRES_DB": "app",
        "POSTGRES_USER": "app",
        "POSTGRES_PASSWORD": "${DB_PASSWORD:?DB_PASSWORD is required}"
      },
      "volumes": [
        "db-data:/var/lib/postgresql/data"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U app -d app"
        ],
        "interval": "3s",
        "timeout": "3s",
        "retries": 30
      },
      "restart": "unless-stopped"
    },
    "backend": {
      "build": "./backend",
      "environment": {
        "DATABASE_URL": "Host=db;Database=app;Username=app;Password=${DB_PASSWORD}",
        "TEST_CLOCK_ENABLED": "true",
        "ASPNETCORE_ENVIRONMENT": "Production"
      },
      "depends_on": {
        "db": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; head -n1 <&3 | grep -q 200'"
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 30,
        "start_period": "15s"
      },
      "restart": "unless-stopped"
    },
    "frontend": {
      "build": "./frontend",
      "ports": [
        "127.0.0.1::80"
      ],
      "depends_on": {
        "backend": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1/health"
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 30
      },
      "restart": "unless-stopped"
    },
    "checks": {
      "build": {
        "context": ".",
        "dockerfile": "scripts/Dockerfile"
      },
      "profiles": [
        "checks"
      ],
      "working_dir": "/checks",
      "environment": {
        "BASE_URL": "http://frontend"
      },
      "depends_on": {
        "frontend": {
          "condition": "service_healthy"
        }
      },
      "command": [
        "python",
        "/checks/tests.py"
      ],
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ]
    }
  },
  "volumes": {
    "db-data": {}
  }
}
