server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 1m;
 location /api/ { proxy_pass http://backend:8080; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
 location = /health { proxy_pass http://backend:8080/health; }
 location = /ngsw-worker.js { add_header Cache-Control 'no-cache'; }
 location = /ngsw.json { add_header Cache-Control 'no-cache'; }
 location / { try_files $uri $uri/ /index.html; }
 add_header X-Content-Type-Options nosniff;
 add_header Referrer-Policy same-origin;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'" always;
}
