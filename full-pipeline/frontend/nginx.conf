server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location = /health { access_log off; default_type application/json; return 200 '{"status":"ok"}'; }
    location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 120s; }
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(?:js|css)$ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
}
